<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Lee Family Cats</title>
    <link rel="icon" type="image/png" href="images/iconmonstr-cat.png">
    <style>
        body{
            padding: 30px;
            font-family: Arial, sans-serif;
            background-color: #F2FCFF;
        }
    </style>
</head>
<body>
    <header style="text-align:center">
        <h1>The Lee Family Cats</h1>
        <nav>
            <a href="#taro">See Taro</a>
            <a href="#churro">See Churro</a>
            <a href="#waffles">See Waffles</a>
            <a href="#pancakes">See Pancakes</a>
        </nav>

    <main>
        <p>
            Let me introduce my family's four cats:
        </p>
        <ul>
            <li><figure id="taro">
                <img src="images/taro-toys.jpg" alt="gray medium hair cat with two toys" width="15%">

            </figure></li>
             <li><figure id="churro">
                <img src="images/churro-headtilt.jpg" alt="dark gray tabby cat tilting head" width="15%">

            </figure></li>
             <li><figure id="waffles">
                <img src="images/waffles-blep.jpg" alt="brown tabby cat with tongue sticking out" width="15%">
                <figcaption>Waffles: My older sister's eldest son who loves being held like a baby</figcaption>
            </figure></li>
             <li><figure id="pancakes">
                <img src="images/pancakes-goldenhour.jpg" alt="light grey tabby cat" width="15%">
                <figcaption>Pancakes: Waffles' younger sister who has a lot to say and makes sure everyone hears</figcaption>
            </figure></li>
        </ul>
        <p>
            For more Lee Family cats content, follow <a href="https://www.instagram.com/tarochurro.jpg" target="blank">tarochurro.jpg</a> on Instagram!
